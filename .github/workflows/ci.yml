name: ci build

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: 'src/CloudAwesome.Xrm.Simulate/CloudAwesome.Xrm.Simulate.sln'
  TEST_PROJECT_PATH: 'src\CloudAwesome.Xrm.Simulate\CloudAwesome.Xrm.Simulate.Test\CloudAwesome.Xrm.Simulate.Test.csproj'

jobs:
  validate:
    name: Build, test, and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_PATH }}"

      - name: Build
        run: dotnet build "${{ env.SOLUTION_PATH }}" --configuration Release --no-restore

      - name: Test with coverage
        run: dotnet test "${{ env.TEST_PROJECT_PATH }}" --configuration Release --no-build --no-restore --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

      - name: Upload coverage results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-results
          path: TestResults/**/coverage.cobertura.xml
